syntax = "proto3";

package notification.v1;

option go_package = "github.com/ramisoul84/kfc-crm/gen/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendWelcomeEmail(SendWelcomeEmailRequest) returns (SendWelcomeEmailResponse);
  rpc SendPasswordResetEmail(SendPasswordResetEmailRequest) returns (SendPasswordResetEmailResponse);
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
}

// ─────────── Welcome Email ───────────

message SendWelcomeEmailRequest {
  string to               = 1;
  string email            = 2;
  string role_name        = 3;
  string initial_password = 4;
  string restaurant_id    = 5;
  string region_id        = 6;
}

message SendWelcomeEmailResponse {
  bool   success         = 1;
  string message         = 2;
  string notification_id = 3;
  google.protobuf.Timestamp sent_at = 4;
}

// ─────────── Password Reset ───────────

message SendPasswordResetEmailRequest {
  string to           = 1;
  string email        = 2;
  string new_password = 3;
}

message SendPasswordResetEmailResponse {
  bool   success         = 1;
  string message         = 2;
  string notification_id = 3;
  google.protobuf.Timestamp sent_at = 4;
}

// ─────────── Generic Email ───────────

message SendEmailRequest {
  string to      = 1;
  string subject = 2;
  string body    = 3;
  bool   is_html = 4;
}

message SendEmailResponse {
  bool   success         = 1;
  string message         = 2;
  string notification_id = 3;
  google.protobuf.Timestamp sent_at = 4;
}