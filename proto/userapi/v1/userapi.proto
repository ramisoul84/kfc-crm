syntax = "proto3";

package userapi.v1;

option go_package = "github.com/ramisoul84/kfc-crm/gen/userapi/v1;userapiv1";

// UserAPIService receives pairing codes and device credentials from CRM.
// CRM is the source of truth; userapi caches codes in Redis for fast
// device-side validation.
service UserAPIService {
  // CachePairingCodes bulk-loads pairing codes into userapi's Redis.
  // Called once per "Pair all devices" batch.
  rpc CachePairingCodes(CachePairingCodesRequest) returns (CachePairingCodesResponse);

  // CachePairingCode caches a single code (single-device re-pair).
  rpc CachePairingCode(CachePairingCodeRequest) returns (CachePairingCodeResponse);

  // RevokePairingCode removes a code (e.g. manager cancelled, or it was used).
  rpc RevokePairingCode(RevokePairingCodeRequest) returns (RevokePairingCodeResponse);
}

message CachePairingCodesRequest {
  string restaurant_id = 1;
  int64  expires_at    = 2; // unix seconds
  repeated PairingCode codes = 3;
}

message PairingCode {
  string serial_number = 1;
  string device_id     = 2;
  string code          = 3; // plaintext; userapi hashes it before storing
}

message CachePairingCodesResponse {
  bool   success = 1;
  int32  cached  = 2;
  string message = 3;
}

message CachePairingCodeRequest {
  string restaurant_id = 1;
  string serial_number = 2;
  string device_id     = 3;
  string code          = 4;
  int64  expires_at    = 5;
}

message CachePairingCodeResponse {
  bool   success = 1;
  string message = 2;
}

message RevokePairingCodeRequest {
  string serial_number = 1;
}

message RevokePairingCodeResponse {
  bool   success = 1;
  string message = 2;
}